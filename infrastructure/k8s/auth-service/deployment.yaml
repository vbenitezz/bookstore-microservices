apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: bookstore
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 578426902456.dkr.ecr.us-east-1.amazonaws.com/bookstore/auth-service:latest
          ports:
            - containerPort: 3001
              name: http
            - containerPort: 50051
              name: grpc

          # Variables no sensibles desde ConfigMap
          envFrom:
            - configMapRef:
                name: auth-service-config

          # Variables sensibles desde Secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstore-secrets
                  key: AUTH_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookstore-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookstore-secrets
                  key: JWT_REFRESH_SECRET

          # Health checks
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"

      # Política de reinicio
      restartPolicy: Always

      # Tiempo máximo para terminar el pod gracefully
      terminationGracePeriodSeconds: 30