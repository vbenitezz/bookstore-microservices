apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: bookstore
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  # ClusterIP: solo accesible dentro del clúster
  # El API Gateway (Nginx/ALB) enruta al puerto REST
  # Los otros servicios llaman al puerto gRPC directamente
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP