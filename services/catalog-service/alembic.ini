# alembic.ini — Configuración de Alembic para Catalog Service
# Alembic es el sistema de migraciones de SQLAlchemy.
# Permite versionar cambios en el schema de base de datos.

[alembic]
# Carpeta donde viven las migraciones
script_location = alembic

# Formato del nombre de los archivos de migración
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# La URL de conexión se inyecta desde env.py, no desde aquí
# para no hardcodear credenciales
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S