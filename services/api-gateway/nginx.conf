# =============================================================================
# nginx.conf — API Gateway principal
# =============================================================================
# Nginx actúa como punto de entrada único (puerto 80).
# Todas las rutas /api/* se enrutan al microservicio correspondiente.
# El frontend React se sirve desde / (en desarrollo, hace proxy a Vite).
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato de logs con correlation ID
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_id="$request_id"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Genera un ID único por request (correlation ID)
    add_header X-Request-ID $request_id always;

    # Ocultar versión de Nginx (seguridad)
    server_tokens off;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Cargar configuración de rutas
    include /etc/nginx/conf.d/*.conf;
}