# =============================================================================
# conf.d/bookstore.conf — Upstreams y routing de microservicios
# =============================================================================

# --- Upstreams (balanceo de carga, en producción tendrían múltiples instancias) ---

upstream auth_service {
    server auth-service:3001;
    keepalive 32;
}

upstream catalog_service {
    server catalog-service:3002;
    keepalive 32;
}

upstream cart_service {
    server cart-service:3003;
    keepalive 32;
}

upstream order_service {
    server order-service:3004;
    keepalive 32;
}

upstream payment_service {
    server payment-service:3005;
    keepalive 32;
}

upstream frontend {
    # En desarrollo: servidor de Vite
    # En producción: cambiar a contenedor del frontend o eliminar (S3/CloudFront)
    server frontend:5173;
}

# =============================================================================
# Servidor principal
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # Headers comunes para todos los proxies
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Connection        "";

    # Rate limiting global (definir zonas en nginx.conf si se necesita más granularidad)
    # limit_req zone=api burst=20 nodelay;

    # -------------------------------------------------------------------------
    # Health check del gateway
    # -------------------------------------------------------------------------
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # -------------------------------------------------------------------------
    # Auth Service → /api/auth/*
    # -------------------------------------------------------------------------
    location /api/auth/ {
        proxy_pass http://auth_service/;
    }

    # -------------------------------------------------------------------------
    # Catalog Service → /api/catalog/*
    # -------------------------------------------------------------------------
    location /api/catalog/ {
        proxy_pass http://catalog_service/;
    }

    # -------------------------------------------------------------------------
    # Cart Service → /api/cart/*
    # -------------------------------------------------------------------------
    location /api/cart/ {
        proxy_pass http://cart_service/;
    }

    # -------------------------------------------------------------------------
    # Order Service → /api/orders/*
    # -------------------------------------------------------------------------
    location /api/orders/ {
        proxy_pass http://order_service/;
    }

    # -------------------------------------------------------------------------
    # Payment Service → /api/payments/*
    # Nota: los webhooks de Stripe llegan aquí también
    # -------------------------------------------------------------------------
    location /api/payments/ {
        proxy_pass http://payment_service/;
    }

    # Webhook de Stripe (necesita body sin modificar para validar firma)
    location /api/payments/webhook {
        proxy_pass http://payment_service/webhook;
        proxy_set_header X-Stripe-Signature $http_x_stripe_signature;
    }

    # -------------------------------------------------------------------------
    # Frontend React → todo lo demás
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        # Soporte para React Router (SPA): cualquier ruta que no sea archivo sirve index.html
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        proxy_pass http://frontend;
    }

    # -------------------------------------------------------------------------
    # Páginas de error personalizadas
    # -------------------------------------------------------------------------
    error_page 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        return 503 '{"error":"service_unavailable","message":"El servicio no está disponible temporalmente"}';
        add_header Content-Type application/json;
    }
}