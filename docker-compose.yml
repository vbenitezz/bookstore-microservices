version: '3.9'
 
# =============================================================================
# BookStore — Docker Compose (entorno local de desarrollo)
# =============================================================================
# Infraestructura:
#   - PostgreSQL: una instancia, 4 schemas aislados
#   - Redis: Cart Service y sesiones
#   - RabbitMQ: mensajería asíncrona entre servicios
#
# Servicios:
#   - api-gateway (Nginx) :80
#   - auth-service        :3001 (REST) :50051 (gRPC)
#   - catalog-service     :3002 (REST) :50052 (gRPC)
#   - cart-service        :3003 (REST)
#   - order-service       :3004 (REST)
#   - payment-service     :3005 (REST)
#   - email-service       :3006 (interno)
# =============================================================================
 
services:
 
  # ---------------------------------------------------------------------------
  # INFRAESTRUCTURA
  # ---------------------------------------------------------------------------
 
  postgres:
    image: postgres:16-alpine
    container_name: bookstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: bookstore_main
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CATALOG_DB_USER: ${CATALOG_DB_USER}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      ORDER_DB_USER: ${ORDER_DB_USER}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización: crea schemas y usuarios
      - ./infrastructure/docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ROOT_USER} -d bookstore_main"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-network
 
  redis:
    image: redis:7-alpine
    container_name: bookstore-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-network
 
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bookstore-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - bookstore-network
 
  # ---------------------------------------------------------------------------
  # API GATEWAY
  # ---------------------------------------------------------------------------
 
  api-gateway:
    image: nginx:1.25-alpine
    container_name: bookstore-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./services/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/api-gateway/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - order-service
      - payment-service
    networks:
      - bookstore-network
 
  # ---------------------------------------------------------------------------
  # AUTH SERVICE — Node.js + Express + gRPC server
  # ---------------------------------------------------------------------------
 
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: ../../infrastructure/docker/Dockerfile.node
    container_name: bookstore-auth
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: auth-service
      PORT: ${AUTH_SERVICE_PORT}
      GRPC_PORT: ${AUTH_GRPC_PORT}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_NAME: ${AUTH_DB_NAME}
      DB_SCHEMA: ${AUTH_DB_SCHEMA}
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
      - "${AUTH_GRPC_PORT}:${AUTH_GRPC_PORT}"
    volumes:
      - ./services/auth-service:/app
      - ./proto:/app/proto
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${AUTH_SERVICE_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-network
 
  # ---------------------------------------------------------------------------
  # CATALOG SERVICE — Python + FastAPI + gRPC server
  # ---------------------------------------------------------------------------
 
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: ../../infrastructure/docker/Dockerfile.python
    container_name: bookstore-catalog
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: catalog-service
      PORT: ${CATALOG_SERVICE_PORT}
      GRPC_PORT: ${CATALOG_GRPC_PORT}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      DB_NAME: ${CATALOG_DB_NAME}
      DB_SCHEMA: ${CATALOG_DB_SCHEMA}
    ports:
      - "${CATALOG_SERVICE_PORT}:${CATALOG_SERVICE_PORT}"
      - "${CATALOG_GRPC_PORT}:${CATALOG_GRPC_PORT}"
    volumes:
      - ./services/catalog-service:/app
      - ./proto:/app/proto
    
    command: sh -c "
      python src/grpc/compile_proto.py &&
      alembic upgrade head &&
      uvicorn src.main:app --host 0.0.0.0 --port ${CATALOG_SERVICE_PORT} --reload
      "
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${CATALOG_SERVICE_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-network
 
  # ---------------------------------------------------------------------------
  # CART SERVICE — Node.js + Express + Redis
  # ---------------------------------------------------------------------------
 
  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: ../../infrastructure/docker/Dockerfile.node
    container_name: bookstore-cart
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: cart-service
      PORT: ${CART_SERVICE_PORT}
      GRPC_PORT: ${CART_GRPC_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_GRPC_URL: ${AUTH_GRPC_URL}
      CATALOG_GRPC_URL: ${CATALOG_GRPC_URL}
    ports:
      - "${CART_SERVICE_PORT}:${CART_SERVICE_PORT}"
      - "${CART_GRPC_PORT}:${CART_GRPC_PORT}"
    volumes:
      - ./services/cart-service:/app
      - ./proto:/app/proto
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    networks:
      - bookstore-network
 
  # ---------------------------------------------------------------------------
  # ORDER SERVICE — Node.js + Express
  # ---------------------------------------------------------------------------
 
  order-service:
    build:
      context: ./services/order-service
      dockerfile: ../../infrastructure/docker/Dockerfile.node
    container_name: bookstore-order
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: order-service
      PORT: ${ORDER_SERVICE_PORT}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${ORDER_DB_USER}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      DB_NAME: ${ORDER_DB_NAME}
      DB_SCHEMA: ${ORDER_DB_SCHEMA}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/
      AUTH_GRPC_URL: ${AUTH_GRPC_URL}
      CATALOG_GRPC_URL: ${CATALOG_GRPC_URL}
      CART_GRPC_URL: ${CART_GRPC_URL}
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    volumes:
      - ./services/order-service:/app
      - ./proto:/app/proto
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${ORDER_SERVICE_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-network
 
  # ---------------------------------------------------------------------------
  # PAYMENT SERVICE — Node.js + Express + Stripe
  # ---------------------------------------------------------------------------
 
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: ../../infrastructure/docker/Dockerfile.node
    container_name: bookstore-payment
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: payment-service
      PORT: ${PAYMENT_SERVICE_PORT}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${PAYMENT_DB_USER}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      DB_NAME: ${PAYMENT_DB_NAME}
      DB_SCHEMA: ${PAYMENT_DB_SCHEMA}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      AUTH_GRPC_URL: ${AUTH_GRPC_URL}
      PROTO_DIR: /app/proto
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    volumes:
      - ./services/payment-service:/app
      - ./proto:/app/proto
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PAYMENT_SERVICE_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-network
 
  # ---------------------------------------------------------------------------
  # EMAIL SERVICE — Node.js (consumer puro, sin REST público)
  # ---------------------------------------------------------------------------
 
  email-service:
    build:
      context: ./services/email-service
      dockerfile: ../../infrastructure/docker/Dockerfile.node
    container_name: bookstore-email
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: email-service
      PORT: ${EMAIL_SERVICE_PORT}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
    ports:
      - "${EMAIL_SERVICE_PORT}:${EMAIL_SERVICE_PORT}"
    volumes:
      - ./services/email-service:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${EMAIL_SERVICE_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-network
 
# =============================================================================
# VOLÚMENES
# =============================================================================
 
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
 
# =============================================================================
# REDES
# =============================================================================
 
networks:
  bookstore-network:
    driver: bridge
    name: bookstore-network